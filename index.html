<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google Sign-In</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f4f6;
      padding: 20px;
      color: #111827;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 14px;
      padding: 28px 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h1 {
      font-size: 1.35rem;
      margin-bottom: 8px;
    }
    p.subtitle {
      font-size: 0.92rem;
      color: #4b5563;
      margin-bottom: 22px;
    }
    .btn-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }
    .profile-box {
      display: none;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
    }
    .profile-box img {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 10px;
    }
    .profile-name {
      font-weight: 700;
      font-size: 1.05rem;
    }
    .profile-email {
      font-size: 0.88rem;
      color: #6b7280;
      margin-top: 2px;
      word-break: break-all;
    }
    .logout-btn {
      margin-top: 14px;
      padding: 9px 16px;
      border: none;
      border-radius: 8px;
      background: #ef4444;
      color: #ffffff;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .logout-btn:hover {
      background: #dc2626;
    }
    .status {
      margin-top: 12px;
      font-size: 0.82rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Google অ্যাকাউন্টে লগইন করুন</h1>
    <p class="subtitle">আপনার Google অ্যাকাউন্ট দিয়ে সাইন-ইন সম্পন্ন করুন</p>

    <div id="g_id_onload"
         data-client_id="1079786436640-jekc3jc7m28nk3eoq54kdsa8g0apq9ep.apps.googleusercontent.com"
         data-context="signin"
         data-ux_mode="popup"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false">
    </div>

    <div class="btn-wrap">
      <div class="g_id_signin"
           data-type="standard"
           data-shape="rectangular"
           data-theme="outline"
           data-text="signin_with"
           data-size="large"
           data-logo_alignment="left">
      </div>
    </div>

    <div id="profileBox" class="profile-box">
      <img id="userPicture" src="" alt="User Avatar" />
      <div id="userName" class="profile-name"></div>
      <div id="userEmail" class="profile-email"></div>
      <button type="button" class="logout-btn" onclick="signOutUser()">লগআউট</button>
    </div>

    <div id="statusMsg" class="status"></div>
  </div>

  <script>
    function decodeJwtResponse(token) {
      const base64Url = token.split(".")[1];
      const base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
      const jsonPayload = decodeURIComponent(
        atob(base64)
          .split("")
          .map((c) => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2))
          .join("")
      );
      return JSON.parse(jsonPayload);
    }

    function handleCredentialResponse(response) {
      try {
        const user = decodeJwtResponse(response.credential);
        document.getElementById("userPicture").src = user.picture || "";
        document.getElementById("userName").textContent = user.name || "Google User";
        document.getElementById("userEmail").textContent = user.email || "";
        document.getElementById("profileBox").style.display = "block";
        document.getElementById("statusMsg").textContent = "সফলভাবে লগইন হয়েছে।";
      } catch (err) {
        document.getElementById("statusMsg").textContent = "লগইন তথ্য পড়তে সমস্যা হয়েছে।";
      }
    }

    function signOutUser() {
      document.getElementById("profileBox").style.display = "none";
      document.getElementById("userPicture").src = "";
      document.getElementById("userName").textContent = "";
      document.getElementById("userEmail").textContent = "";
      document.getElementById("statusMsg").textContent = "লগআউট সম্পন্ন হয়েছে।";
      if (window.google && google.accounts && google.accounts.id) {
        google.accounts.id.disableAutoSelect();
      }
    }
  </script>
</body>
</html>
